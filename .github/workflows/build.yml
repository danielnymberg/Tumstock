name: Bygg Mätverktyg APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gör gradlew körbar
        run: chmod +x gradlew

      - name: Bygg debug-APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Döp om APK
        run: cp app/build/outputs/apk/debug/app-debug.apk matverktyg.apk

      - name: Ladda upp som artifact
        uses: actions/upload-artifact@v4
        with:
          name: matverktyg-apk
          path: matverktyg.apk
          if-no-files-found: error

      - name: Publicera rullande release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mätverktyg (senaste bygget)
          body: |
            Automatiskt byggd debug-APK. Ladda ner `matverktyg.apk`, öppna på
            telefonen och installera. Se README.md.
          files: matverktyg.apk
          prerelease: true

      - name: Publicera APK till git-gren (apk-build) för intern hämtning
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "$GITHUB_WORKSPACE/matverktyg.apk" ./matverktyg.apk
          rm -rf .git
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f matverktyg.apk
          git commit -q -m "APK-bygge ${GITHUB_SHA}"
          git branch -M apk-build
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-build
